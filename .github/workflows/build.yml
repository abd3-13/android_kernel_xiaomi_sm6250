
name: Build kernel

on:
  workflow_dispatch:
    inputs:
      defconfig_choice:
        description: "Which defconfig should build.sh apply?"
        type: choice
        required: true
        default: both
        options:
          - droidspace
          - usbarsenal
          - both

      patch_choice:
        description: "Which patches should build.sh apply?"
        type: choice
        required: true
        default: both
        options:
          - droidspace
          - usbarsenal
          - both

      build_mode:
        description: "Build mode"
        type: choice
        required: true
        default: configured
        options:
          - configured
          - clean

      push_to_release:
        description: "Upload the build to a GitHub Release"
        type: boolean
        required: true
        default: true

  push:
    branches:
      - 16.2
      - 16.2-NEW
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  OUT: out
  DEFCONFIG: arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G

  # Options consumed by build.sh
  DEFCONFIG_CHOICE: ${{ inputs.defconfig_choice || 'both' }}
  PATCH_CHOICE: ${{ inputs.patch_choice || 'both' }}
  BUILD_MODE: ${{ inputs.build_mode || 'configured' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libelf-dev \
            libssl-dev python3 rsync unzip zip zstd
          ccache --version | head -1

      - name: Cache prebuilt toolchains
        uses: actions/cache@v4
        with:
          path: |
            clang
            gcc32
            gcc64
          key: toolchains-clang-6443078-gcc-4.9-v1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Show build configuration
        run: |
          echo "Build mode: $BUILD_MODE"
          echo "Defconfig selection: $DEFCONFIG_CHOICE"
          echo "Patch selection: $PATCH_CHOICE"
          echo "Publish release: ${{ github.event_name != 'workflow_dispatch' || inputs.push_to_release }}"

      - name: Build kernel
        run: bash build.sh

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: BlackHole-miatoll-${{ github.run_number }}
          path: AnyKernel/*.zip*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.push_to_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          zip_file=$(find AnyKernel -maxdepth 1 -name '*.zip' -print -quit)
          sha_file="$zip_file.sha256"
          test -n "$zip_file"
          test -f "$sha_file"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            target_args=()
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            target_args=(--target "$GITHUB_SHA")
          fi

          title="BlackHole miatoll ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          notes="Automated kernel build.
          Build mode: ${BUILD_MODE}
          Defconfig: ${DEFCONFIG_CHOICE}
          Patches: ${PATCH_CHOICE}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF_NAME}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip_file" "$sha_file" --clobber
          else
            gh release create "$tag" "$zip_file" "$sha_file" \
              "${target_args[@]}" \
              --title "$title" \
              --notes "$notes"
          fi
